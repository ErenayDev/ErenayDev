name: Block Clankers
description: Auto-block known bot accounts from your personal GitHub account and/or organizations.
branding:
  icon: shield
  color: red

inputs:
  token:
    description: |
      PAT with scopes appropriate for the targets:
        - `user` to block at the personal-account level
        - `admin:org` to block at the org level
        - `read:org` to auto-discover orgs you admin (only needed for @auto)
      A classic PAT with `user, admin:org` covers everything.
    required: true
  targets:
    description: |
      Newline- or comma-separated list of targets to sync. Tokens:
        @me     - your personal account (/user/blocks)
        @auto   - @me plus every org where you are an admin
        <name>  - a specific org (/orgs/<name>/blocks)
      Default: @me
    required: false
    default: "@me"
  source-url:
    description: URL to a JSON array of objects with a `username` field.
    required: false
    default: https://raw.githubusercontent.com/UnsafeLabs/Bounty-Hunters/main/clankers.json
  dry-run:
    description: If "true", log actions without calling write endpoints.
    required: false
    default: "false"
  unblock-removed:
    description: If "true", unblock users no longer in the source list. Off by default (additive only).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Block clankers
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TARGETS: ${{ inputs.targets }}
        SOURCE_URL: ${{ inputs.source-url }}
        DRY_RUN: ${{ inputs.dry-run }}
        UNBLOCK_REMOVED: ${{ inputs.unblock-removed }}
      run: ${{ github.action_path }}/scripts/block.sh
